# Runs the tests of the Python wrapper and its MCP server (python/) against the
# R package of the same commit, on every push and PR. The wrapper calls the R
# package through rpy2, so a change on either side can break it.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: python-test

permissions: read-all

jobs:
  python-test:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      # The repo is an renv project, so with these files the R packages would
      # go into renv's project library. rpy2 starts R from python/, where renv
      # is not active, and would not find them. Without the files they go into
      # R_LIBS_USER, which rpy2's R reads. Only this runner's checkout changes.
      - name: Leave out renv
        run: rm -rf renv .Rprofile renv.lock

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # lago_report() renders with rmarkdown, which needs pandoc
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check

      - name: Check that R finds LAGOtrials
        run: Rscript -e 'print(.libPaths()); cat("LAGOtrials", format(packageVersion("LAGOtrials")), "\n")'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Python wrapper with its MCP and test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "python[mcp,test]"

      - name: Run the Python tests
        working-directory: python
        run: |
          export R_HOME="$(R RHOME)"
          # fail, rather than skip, when R or LAGOtrials cannot be loaded
          export LAGO_REQUIRE_R=1
          python -m pytest -q -rs
