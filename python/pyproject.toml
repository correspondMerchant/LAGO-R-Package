[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lago-python"
version = "0.1.0"
description = "Python wrapper for the LAGOtrials R package (calls the real R functions via rpy2)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-only" }
authors = [
    { name = "Ante Bing", email = "abing@bu.edu" },
]
keywords = ["LAGO", "optimization", "rpy2", "R", "intervention"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = [
    "rpy2>=3.5",
    "pandas>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/correspondMerchant/LAGO-R-Package"
Issues = "https://github.com/correspondMerchant/LAGO-R-Package/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["lago*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
